services:
  api:
    build:
      context: ./CranberryAPI
      dockerfile: Dockerfile
    image: cranberry-api:latest
    container_name: cranberry-api
    restart: unless-stopped
    env_file:
      - ./CranberryAPI/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # host:container — gọi từ Postman: http://<IP-public-Oracle>:8080
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
